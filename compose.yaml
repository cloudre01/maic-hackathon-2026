services:
  arus:
    build: .
    image: arus-backend
    restart: unless-stopped
    # Bound to loopback only; Caddy on the host terminates TLS and proxies here.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Origins allowed to make writes, comma separated. Set this to the
      # deployed frontend, e.g. ARUS_ALLOWED_ORIGINS=https://arus.vercel.app
      ARUS_ALLOWED_ORIGINS: ${ARUS_ALLOWED_ORIGINS:-}
      # Shared secret the frontend proxy presents. Unset means no check.
      ARUS_API_TOKEN: ${ARUS_API_TOKEN:-}
    volumes:
      - arus-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  arus-data:
